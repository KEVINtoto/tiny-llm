[package]
name = "tiny-llm-agent"
version = "0.1.0"
edition = "2024"

[lib]
path = "agent/lib.rs"

[[bin]]
name = "agent-cli"
path = "agent/agent-cli.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
shlex = "1.3"

[dev-dependencies]
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
tempfile = "3"

[[test]]
name = "test_model_service"
path = "agent/tests/test_model_service.rs"

