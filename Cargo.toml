[workspace]
members = ["agent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# src
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"
sha2 = "0.10"
shlex = "1.3"
# dev(tests)
syn = { version = "2", features = ["full"] }
tempfile = "3"
